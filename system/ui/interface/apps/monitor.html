<section class="app-window monitor-app" data-app="monitor">
  <header class="app-titlebar"><strong>MONITOR</strong><span>{{ CURRENT_FPS }} FPS</span></header>
  <dl class="monitor-metrics"><dt>CPU</dt><dd>{{ CPU_USAGE }}%</dd><dt>RAM</dt><dd>{{ RAM_USAGE }}%</dd><dt>GPU</dt><dd>{{ GPU_USAGE }}%</dd></dl>
  <button data-action="focus_terminal">Abrir diagnóstico</button>
</section>
