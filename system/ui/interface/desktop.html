<link rel="stylesheet" href="../styles/desktop.css">
<main class="desktop">
  <!-- runtime composes topbar.html, dock.html, launcher.html and alt-tab.html -->
  <header class="topbar"><strong>CSOS</strong><span class="status">● Sistema Online</span></header>
  <section class="status-card">
    <span>CPU {{ CPU_USAGE }}%</span><span>RAM {{ RAM_USAGE }}%</span><span>GPU {{ GPU_USAGE }}%</span>
    <span>Rede {{ NETWORK_IP }}</span>
  </section>
  <button data-action="open_files">Arquivos</button>
</main>
