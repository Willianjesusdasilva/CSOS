[constants]
zig = '@DIRNAME@' / '../.tools/zig-x86_64-windows-0.16.0/zig.exe'
runtime = '@DIRNAME@' / '../zig-out/mesa-sysroot/usr'
deps = '@DIRNAME@' / '../zig-out/nix-sysroot-wsl/usr'

[binaries]
c = [zig, 'cc', '-target', 'x86_64-linux-musl']
cpp = [zig, 'c++', '-target', 'x86_64-linux-musl']
ar = [zig, 'ar']
strip = [zig, 'objcopy', '--strip-all']
pkg-config = '@DIRNAME@' / '../zig-out/nix-tools/bin/pkg-config.exe'
bison = '@DIRNAME@' / '../zig-out/winflexbison/bison.exe'
flex = '@DIRNAME@' / '../zig-out/winflexbison/flex.exe'
ln = 'C:/Program Files/Git/usr/bin/ln.exe'
ls = 'C:/Program Files/Git/usr/bin/ls.exe'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true
pkg_config_libdir = ['@DIRNAME@' / '../zig-out/mesa-sysroot/usr/lib/pkgconfig', '@DIRNAME@' / '../zig-out/nix-sysroot-wsl/usr/lib/pkgconfig']
have_c99_vsnprintf = true
have_c99_snprintf = true
have_unix98_printf = true
va_val_copy = true
growing_stack = true
have_proc_self_cmdline = false
have_strlcpy = true

[built-in options]
c_args = ['-isystem', runtime / 'include', '-isystem', deps / 'include']
cpp_args = ['-isystem', runtime / 'include', '-isystem', deps / 'include', '-isystem', '@DIRNAME@' / '../zig-out/boost-tar2/boost_1_87_0', '-include', 'C:/git/csos/zig-out/nix-cross-prelude.h']
