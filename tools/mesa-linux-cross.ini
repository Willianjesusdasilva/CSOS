[constants]
zig = '@DIRNAME@' / '../.tools/zig-x86_64-windows-0.16.0/zig.exe'
python = '@DIRNAME@' / '../.tools/mesa-build-env/Scripts/python.exe'
zig_wrapper = '@DIRNAME@' / 'zig-cc-wrapper.py'
cpu_model = '@DIRNAME@' / '../zig-out/mesa-sysroot/usr/lib/compiler-rt-cpu-model.o'

[binaries]
c = [python, zig_wrapper, zig, 'cc', '-target', 'x86_64-linux-musl']
cpp = [python, zig_wrapper, zig, 'c++', '-target', 'x86_64-linux-musl']
ar = [zig, 'ar']
strip = [zig, 'objcopy', '--strip-all']
pkg-config = '@DIRNAME@' / '../.tools/mesa-build-env/Lib/site-packages/pkgconf/.bin/pkgconf.exe'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
c_link_args = [cpu_model]
cpp_link_args = [cpu_model]

[properties]
needs_exe_wrapper = true
pkg_config_libdir = ['@DIRNAME@' / '../zig-out/mesa-sysroot/usr/lib/pkgconfig']
