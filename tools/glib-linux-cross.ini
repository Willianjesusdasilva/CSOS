[constants]
zig = '@DIRNAME@' / '../.tools/zig-x86_64-windows-0.16.0/zig.exe'
python = '@DIRNAME@' / '../.tools/mesa-build-env/Scripts/python.exe'
wrapper = '@DIRNAME@' / 'zig-cc-wrapper.py'

[binaries]
c = [python, wrapper, zig, 'cc', '-target', 'x86_64-linux-musl']
cpp = [python, wrapper, zig, 'c++', '-target', 'x86_64-linux-musl']
ar = [zig, 'ar']
strip = [zig, 'objcopy', '--strip-all']
pkg-config = '@DIRNAME@' / '../.tools/mesa-build-env/Scripts/pkgconf.exe'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true
pkg_config_libdir = ['@DIRNAME@' / '../zig-out/mesa-sysroot/usr/lib/pkgconfig']
