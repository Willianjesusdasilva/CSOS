[constants]
zig = '@DIRNAME@' / '../.tools/zig-x86_64-windows-0.16.0/zig.exe'
sysroot = '@DIRNAME@' / '../zig-out/mesa-sysroot/usr/include'

[binaries]
c = [zig, 'cc', '-target', 'x86_64-linux-musl']
cpp = [zig, 'c++', '-target', 'x86_64-linux-musl']
ar = [zig, 'ar']
strip = [zig, 'objcopy', '--strip-all']
pkg-config = '@DIRNAME@' / '../.tools/mesa-build-env/Lib/site-packages/pkgconf/.bin/pkgconf.exe'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true
pkg_config_libdir = ['@DIRNAME@' / '../zig-out/mesa-sysroot/usr/lib/pkgconfig']
# These are target facts for x86_64 musl, not host probe results. Supplying
# them avoids Meson attempting to execute target binaries during configuration.
have_c99_vsnprintf = true
have_c99_snprintf = true
have_unix98_printf = true
va_val_copy = true
growing_stack = true
have_proc_self_cmdline = false
have_strlcpy = true

[built-in options]
# Zig's C frontend enables undefined-behaviour instrumentation for debug/O0
# objects.  Those handlers are not PIC and cannot be embedded in WebKit's
# shared library, so cross-built static dependencies must opt out explicitly.
c_args = ['-isystem', sysroot, '-fno-sanitize=undefined']
cpp_args = ['-isystem', sysroot, '-fno-sanitize=undefined']
